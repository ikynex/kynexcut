name: Build KynexCut Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: JDK 17 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle Wrapper İzni Ver
      run: chmod +x gradlew

    - name: Anahtarı Kasadan Çöz ve key.properties Üret
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > ikynex-release-key.jks
        cat << EOC > key.properties
        storePassword=$KEY_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=../ikynex-release-key.jks
        EOC

    - name: İmzalı Release APK Derle
      run: ./gradlew assembleRelease --no-daemon

    - name: APK Dosyasını Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: KynexCut-Signed-APK
        path: app/build/outputs/apk/release/*release*.apk
